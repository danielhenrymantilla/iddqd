[package]
name = "iddqd-derive"
version = "0.4.2"
description = "Not intended for direct use: proc-macro derives for Equivalent and Comparable"
readme = "README.md"
documentation = "https://docs.rs/iddqd"
repository = "https://github.com/oxidecomputer/iddqd"
keywords = []
categories = []
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg=doc_cfg"]

[lints]
workspace = true

[dependencies]
proc-macro2 = "1.0.106"
quote = "1.0.46"
syn.version = "2.0.119"
syn.features = ["full", "visit-mut"]

[dev-dependencies]

[features]

[package.metadata.cargo-sync-rdme.badge.badges]
license = true
crates-io = true
docs-rs = true
rust-version = true

[package.metadata.release]
pre-release-replacements = [
    { file = "../iddqd-extended-examples/examples/typify-types.rs", search = "iddqd\" = \".*\"", replace = "iddqd\" = \"{{version}}\"", exactly = 1 },
    { file = "../../CHANGELOG.md", search = "Unreleased", replace = "[{{version}}]", min = 1 },
    { file = "../../CHANGELOG.md", search = "ReleaseDate", replace = "{{date}}", min = 1 },
    { file = "../../CHANGELOG.md", search = "<!-- next-header -->", replace = "<!-- next-header -->\n## Unreleased - ReleaseDate\n", exactly = 1 },
    { file = "../../CHANGELOG.md", search = "<!-- next-url -->", replace = "<!-- next-url -->\n[{{version}}]: https://github.com/oxidecomputer/iddqd/releases/tag/iddqd-{{version}}", exactly = 1 },
]
